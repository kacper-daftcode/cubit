name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical ISA revision
        id: isa
        run: |
          echo "revision=$(python3 -c 'import json; print(json.load(open("tables/SM120_SOURCE.json"))["revision"])')" >> "$GITHUB_OUTPUT"
      - name: Check out canonical ISA data
        uses: actions/checkout@v4
        with:
          repository: kacper-daftcode/blackwell-isa
          ref: ${{ steps.isa.outputs.revision }}
          path: .canonical/blackwell-isa
      - name: Verify vendored ISA table
        run: python3 tools/sync_table.py --check --source .canonical/blackwell-isa/sm120.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --release
      - run: cargo test
      - run: cargo clippy -- -D warnings -A clippy::if_same_then_else
