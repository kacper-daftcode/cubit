name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vendored ISA table (structure + ratchet)
        # Vendored copy carries canonical corrections ahead of the base
        # byte-pin (tables/SM120_SOURCE.json "canon_delta"); validation is
        # structural (schema) + ratchet (456-entry baked-ctrl baseline).
        run: python3 tools/sync_table.py --validate-only
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --release
      - run: cargo test
      - run: cargo clippy -- -D warnings -A clippy::if_same_then_else
