name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vendored ISA table (structure + ratchet)
        # Both arch tables are byte-pinned to blackwell-isa revisions via
        # tables/SOURCE.json; --check verifies the pins, --validate-only
        # adds structural schema + baked-ctrl ratchet (456/1269 baselines).
        run: python3 tools/sync_table.py --validate-only
      - name: Byte-pin vendored ISA tables
        run: python3 tools/sync_table.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --release
      - run: cargo test
      - run: cargo clippy -- -D warnings -A clippy::if_same_then_else
        # one remaining if_same_then_else site lives in a lane-owned working
        # tree (main.rs lastw-MID dedup); drop the -A once that lands.
