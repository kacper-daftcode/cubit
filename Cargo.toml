[package]
name = "cubit"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Open-source SASS assembler and disassembler for NVIDIA Blackwell GPUs (SM120/SM103a)"
license = "MIT"
repository = "https://github.com/kacper-daftcode/cubit"
keywords = ["cuda", "sass", "assembler", "blackwell", "nvidia"]
categories = ["compilers", "hardware-support", "parsing"]

[lib]
name = "cubit"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cubit"
path = "src/main.rs"

[dependencies]
object = { version = "0.36", features = ["read", "write", "elf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
once_cell = "1.21.3"

[features]
default = []
python = ["pyo3"]
