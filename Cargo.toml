[package]
name = "cubit"
version = "0.1.0"
edition = "2021"
description = "SM120 CUDA assembler — table-driven bitfield encoding, no linear solver"

[lib]
name = "cubit"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cubit"
path = "src/main.rs"

[dependencies]
object = { version = "0.36", features = ["read", "write", "elf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
once_cell = "1.21.3"

[features]
default = []
python = ["pyo3"]
